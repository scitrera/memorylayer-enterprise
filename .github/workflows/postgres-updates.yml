name: Check PostgreSQL upstreams

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'postgres-container/**'
      - 'scripts/postgres_updates.py'
      - 'scripts/smoke-postgres.sh'
      - '.github/actions/build-postgres/**'
      - '.github/workflows/postgres-*.yml'
      - '.dockerignore'
      - 'versions.yaml'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild both variants even when inputs match
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: postgres-updates
  cancel-in-progress: false

jobs:
  detect:
    if: github.event.repository.private == false && github.repository_owner == 'scitrera' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      standard: ${{ steps.plan.outputs.standard }}
      cnpg: ${{ steps.plan.outputs.cnpg }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Compare upstream digests and local source against successful builds
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          uv run --no-project --with scitrera-repo-tools==0.1.29 python scripts/postgres_updates.py plan "${args[@]}"
  standard:
    needs: detect
    if: fromJSON(needs.detect.outputs.standard).changed
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/postgres-image.yml
    with:
      plan: ${{ needs.detect.outputs.standard }}
  cnpg:
    needs: detect
    if: fromJSON(needs.detect.outputs.cnpg).changed
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/postgres-image.yml
    with:
      plan: ${{ needs.detect.outputs.cnpg }}

# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Test (Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-memorylayer-data-connectors:
    name: Test memorylayer-data-connectors (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify source versions and release context
        run: |
          uvx --from scitrera-repo-tools==0.1.29 sync-versions --config "$GITHUB_WORKSPACE/versions.yaml" --check
          uv run --no-project --with scitrera-repo-tools==0.1.29 python "$GITHUB_WORKSPACE/scripts/check_release.py"
        working-directory: memorylayer-data-connectors

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: memorylayer-data-connectors

      - name: Run tests
        run: python -m pytest tests/unit -q
        working-directory: memorylayer-data-connectors

  test-memorylayer-enterprise:
    name: Test memorylayer-enterprise (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify source versions and release context
        run: |
          uvx --from scitrera-repo-tools==0.1.29 sync-versions --config "$GITHUB_WORKSPACE/versions.yaml" --check
          uv run --no-project --with scitrera-repo-tools==0.1.29 python "$GITHUB_WORKSPACE/scripts/check_release.py"
        working-directory: memorylayer-enterprise

      - name: Install
        run: python "$GITHUB_WORKSPACE/scripts/dev.py" enterprise --python "$(command -v python)" --release
        working-directory: memorylayer-enterprise

      - name: Run tests
        run: python -m pytest tests/unit -q
        working-directory: memorylayer-enterprise

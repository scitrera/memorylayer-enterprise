# Adapted from scitrera-repo-tools 0.1.29 native builds. The generator skips
# this file because it lacks per-image license overrides. Preserve explicit
# metadata for the PostgreSQL collections; tests/ci checks these overrides.

name: Build & push Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:


concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-memorylayer-data-connectors:
    name: Test memorylayer-data-connectors (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify source versions and release context
        run: |
          uvx --from scitrera-repo-tools==0.1.29 sync-versions --config "$GITHUB_WORKSPACE/versions.yaml" --check
          uv run --no-project --with scitrera-repo-tools==0.1.29 python "$GITHUB_WORKSPACE/scripts/check_release.py"
        working-directory: memorylayer-data-connectors

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: memorylayer-data-connectors

      - name: Run tests
        run: python -m pytest tests/unit -q
        working-directory: memorylayer-data-connectors

  test-memorylayer-enterprise:
    name: Test memorylayer-enterprise (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify source versions and release context
        run: |
          uvx --from scitrera-repo-tools==0.1.29 sync-versions --config "$GITHUB_WORKSPACE/versions.yaml" --check
          uv run --no-project --with scitrera-repo-tools==0.1.29 python "$GITHUB_WORKSPACE/scripts/check_release.py"
        working-directory: memorylayer-enterprise

      - name: Install
        run: python "$GITHUB_WORKSPACE/scripts/dev.py" enterprise --python "$(command -v python)" --release
        working-directory: memorylayer-enterprise

      - name: Run tests
        run: python -m pytest tests/unit -q
        working-directory: memorylayer-enterprise
  build-memorylayer-data-connectors-linux-amd64:
    name: Build memorylayer-data-connectors (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [ test-memorylayer-data-connectors, test-memorylayer-enterprise ]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.29' sync-versions --print-version memorylayer-extensions)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/memorylayer-data-connectors
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.data-connectors
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/scitrera/memorylayer-data-connectors,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=memorylayer-data-connectors-linux-amd64
          cache-to: type=gha,mode=max,scope=memorylayer-data-connectors-linux-amd64

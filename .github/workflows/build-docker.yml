          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/scitrera/memorylayer-data-connectors,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=memorylayer-data-connectors-linux-arm64
          cache-to: type=gha,mode=max,scope=memorylayer-data-connectors-linux-arm64
  merge-memorylayer-data-connectors:
    name: Merge memorylayer-data-connectors multi-arch manifest
    runs-on: ubuntu-latest

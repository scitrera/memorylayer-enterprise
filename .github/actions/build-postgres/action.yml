name: Build and test a native PostgreSQL image
description: Load and smoke-test before pushing a platform digest
inputs:
  plan:
    required: true
    description: Validated JSON from the upstream planner
  platform:
    required: true
    description: linux/amd64 or linux/arm64
  github-token:
    required: true
    description: Token used only to push the tested image to GHCR
outputs:
  digest:
    description: Tested image digest
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.0.1
    - name: Validate inputs and native runner
      shell: bash
      env:
        PLAN: ${{ inputs.plan }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        uv run --no-project --with scitrera-repo-tools==0.1.29 python scripts/postgres_updates.py validate --plan "$PLAN"
        case "$PLATFORM:$(uname -m)" in
          linux/amd64:x86_64|linux/arm64:aarch64) ;;
          *) echo 'Incorrect native runner architecture' >&2; exit 1 ;;
        esac
    - uses: docker/setup-buildx-action@v4
    - name: Build for smoke test
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ fromJSON(inputs.plan).dockerfile }}
        platforms: ${{ inputs.platform }}
        pull: true
        load: true
        push: false
        tags: local/postgres-check:ci
        build-args: |
          BASE_IMAGE=${{ fromJSON(inputs.plan).base_image }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ fromJSON(inputs.plan).version }}
          ai.memorylayer.build-inputs=${{ fromJSON(inputs.plan).fingerprint }}
        cache-from: type=gha,scope=postgres-${{ fromJSON(inputs.plan).variant }}-${{ inputs.platform }}
    - name: Start PostgreSQL and exercise installed extensions
      shell: bash
      run: bash scripts/smoke-postgres.sh local/postgres-check:ci
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Push tested build by digest
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ fromJSON(inputs.plan).dockerfile }}
        platforms: ${{ inputs.platform }}
        outputs: type=image,name=${{ fromJSON(inputs.plan).image }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          BASE_IMAGE=${{ fromJSON(inputs.plan).base_image }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ fromJSON(inputs.plan).version }}
          ai.memorylayer.build-inputs=${{ fromJSON(inputs.plan).fingerprint }}
        cache-to: type=gha,mode=max,scope=postgres-${{ fromJSON(inputs.plan).variant }}-${{ inputs.platform }}

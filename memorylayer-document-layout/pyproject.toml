[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memorylayer-document-layout"
version = "0.2.0"
description = "Deterministic quote location in hash-bound MemoryLayer page layouts"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Scitrera LLC"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/scitrera/memorylayer-enterprise"

[tool.hatch.build.targets.wheel]
packages = ["src/memorylayer_document_layout"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

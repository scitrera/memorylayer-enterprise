[project]
name = "memorylayer-enterprise"
version = "0.0.1"
description = "MemoryLayer.ai SaaS extensions - PostgreSQL, Redis, Analytics, Reflection"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "scitrera.ai", email = "sales@scitrera.com" }
]
keywords = ["ai", "memory", "agents", "llm", "saas", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # scripts/dev.py installs both from one Git revision or local checkout.
    "memorylayer-server>=0.2.0",
    "memorylayer-server-rpg>=0.2.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "click>=8.1.0",
    "uvicorn>=0.25.0",
    "httpx>=0.27.0",
    "pdf2image>=1.16.0",
    "fsspec>=2024.1.0",
    "zstandard>=0.22.0",
    "scitrera-aether-client>=0.2.3",
    "scitrera-messaging-spec>=1.3.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "cryptography>=44.0.0",
    # OpenTelemetry SDK + OTLP exporter (required by OTelInitPlugin)
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    # Auto-instrumentation — FastAPI, SQLAlchemy/asyncpg, Redis, httpx
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.scripts]
memorylayer-enterprise = "memorylayer_saas.cli:main"
memorylayer-worker = "memorylayer_saas.worker.cli:main"

[project.optional-dependencies]
s3 = ["s3fs>=2024.1.0"]
# Note: heavy ML extras (torch, transformers, vllm, qwen-vl-utils) used to
# live here as ``[multimodal]`` and ``[vllm]`` but were never imported by any
# enterprise data-plane code. Phase 3 of the Aether convergence moved them
# to the OSS embed server (oss/memorylayer-embed-server/[gpu]) where they
# actually run.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://memorylayer.ai"
Documentation = "https://docs.memorylayer.ai"
Repository = "https://github.com/scitrera/memorylayer-enterprise"
Issues = "https://github.com/scitrera/memorylayer-enterprise/issues"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorylayer_saas"]

[tool.hatch.build.targets.sdist]
include = ["src/memorylayer_saas", "migrations", "alembic.ini", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

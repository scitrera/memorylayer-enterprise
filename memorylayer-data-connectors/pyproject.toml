[project]
name = "memorylayer-data-connectors"
version = "0.0.1"
description = "Data connectors and VFS catalog for the Scitrera AI platform"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "scitrera.ai", email = "sales@scitrera.com" }
]
keywords = ["ai", "memory", "agents", "llm", "vfs", "connectors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.25.0",
    "pydantic>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aioboto3>=13.0.0",
    "httpx>=0.27.0",
    # Connector SDKs (delay-imported inside each connector; needed at runtime
    # when that connector type is synced). httpx above covers the
    # discord / teams / github connectors, which use it directly.
    "slack_sdk>=3.27.0",                # slack connector
    "google-api-python-client>=2.0.0",  # gdrive connector (googleapiclient)
    "google-auth>=2.0.0",               # gdrive connector (google.oauth2)
    "dropbox>=12.0.0",                  # dropbox connector
    "scitrera-aether-client>=0.2.3",
    "scitrera-app-framework>=0.0.1",
    "scitrera-rt-data>=0.0.7",
    "msgpack>=1.0.0",
    "python-multipart>=0.0.28",
    # OpenTelemetry TRACE export (traces only; no MeterProvider). Shares the
    # MEMORYLAYER_OTEL_* env conventions with MemoryLayer so one config drives
    # both services. Version ranges match memorylayer-enterprise. redis is
    # omitted because data-connectors does not use a redis client.
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.scripts]
data-connectors = "data_connectors.server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://memorylayer.ai"
Repository = "https://github.com/scitrera/memorylayer-enterprise"
Issues = "https://github.com/scitrera/memorylayer-enterprise/issues"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_connectors"]

[tool.hatch.build.targets.sdist]
include = ["src/data_connectors", "alembic.ini", "tests", "tools", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end integration tests requiring docker compose",
]
